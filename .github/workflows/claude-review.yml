name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push cancels the review still running for the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and skip PRs from forks: they can't read this repo's secrets.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's own short-lived token, scoped to the permissions above.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for Minute Meter, an iOS screen time app.
            Read CLAUDE.md and docs/architecture.md first.

            1. Find the linked issue from the "Closes #N" line in the PR description and
               read it with `gh issue view N`. If there's no linked issue, report that as
               the first finding.
            2. Check the PR against the issue: is every acceptance criterion met, and is
               anything included that the issue marks out of scope?
            3. Review the diff for:
               - Correctness and edge cases: midnight, time left reaching 0, unlocks that
                 cross midnight, the app not running when an unlock ends.
               - Ways a user could get more time than their limit allows.
               - Data shared between the app and its extensions.
               - Missing or weak tests.
               - Anything that contradicts docs/architecture.md, or a design change that
                 doesn't update it.
            4. Check that the PR description explains what was built and why, as
               CLAUDE.md requires.

            Before commenting, read the existing inline comments with
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`.
            Don't repeat a problem that already has a comment thread.

            Post an inline comment for each new problem. Then write one summary with
            `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none`,
            so each review replaces the previous summary instead of adding another. Include:
            - Issue coverage: each acceptance criterion, marked met or not met.
            - Findings, most severe first.
            - Verdict: ready to merge, or changes needed.

            Be concise. Skip style nits that don't affect correctness or clarity.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
