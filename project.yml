name: MinuteMeter

options:
  bundleIdPrefix: com.dylankuster
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: 2GDFC79M88
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  MinuteMeter:
    type: application
    platform: iOS
    sources:
      - MinuteMeter
      - path: Shared
        excludes: ["Fonts/OFL.txt"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dylankuster.MinuteMeter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: MinuteMeter/MinuteMeter.entitlements
    info:
      path: MinuteMeter/Info.plist
      properties:
        CFBundleDisplayName: Minute Meter
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts: &fonts
          - Barlow-Regular.ttf
          - Barlow-Medium.ttf
          - Barlow-SemiBold.ttf
          - Barlow-Bold.ttf
          - BarlowSemiCondensed-Medium.ttf
          - BarlowSemiCondensed-SemiBold.ttf
          - BarlowSemiCondensed-Bold.ttf
    entitlements:
      path: MinuteMeter/MinuteMeter.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.dylankuster.MinuteMeter]
        aps-environment: development
    dependencies:
      - target: ShieldConfiguration
      - target: ShieldAction
      - target: Monitor
      - target: LiveActivity

  ShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - ShieldConfiguration
      - path: Shared
        excludes: ["Fonts/**"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dylankuster.MinuteMeter.ShieldConfiguration
    info:
      path: ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: Minute Meter Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ShieldConfiguration/ShieldConfiguration.entitlements
      properties: &screenTimeEntitlements
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.dylankuster.MinuteMeter]

  ShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - ShieldAction
      - path: Shared
        excludes: ["Fonts/**"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dylankuster.MinuteMeter.ShieldAction
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Minute Meter Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ShieldAction/ShieldAction.entitlements
      properties: *screenTimeEntitlements

  Monitor:
    type: app-extension
    platform: iOS
    sources:
      - Monitor
      - path: Shared
        excludes: ["Fonts/**"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dylankuster.MinuteMeter.Monitor
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: Minute Meter Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: Monitor/Monitor.entitlements
      properties: *screenTimeEntitlements

  # Live Activities must ship in a widget extension. This one holds only the
  # Live Activity; there is no home screen widget.
  LiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivity
      - path: Shared
        excludes: ["Fonts/OFL.txt"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dylankuster.MinuteMeter.LiveActivity
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Minute Meter
        UIAppFonts: *fonts
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MinuteMeterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MinuteMeterTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dylankuster.MinuteMeterTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MinuteMeter

  MinuteMeterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MinuteMeterUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dylankuster.MinuteMeterUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MinuteMeter
    dependencies:
      - target: MinuteMeter

schemes:
  MinuteMeter:
    build:
      targets:
        MinuteMeter: all
    test:
      targets:
        - MinuteMeterTests
        - MinuteMeterUITests
